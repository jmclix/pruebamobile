```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hola Mundo</title>

    <!-- Manifest de la PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#ffffff">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-color: white;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        #btnInstalar {
            display: none;
            margin: 30px auto;
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
        }

        #btnInstalar:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

    <h1>Hola Mundo</h1>

    <p>Esta es una aplicación web progresiva.</p>

    <button id="btnInstalar">
        📱 Instalar aplicación
    </button>


    <script>

        // Guardamos el evento que permite instalar la PWA
        let eventoInstalacion;

        const botonInstalar = document.getElementById("btnInstalar");

        window.addEventListener("beforeinstallprompt", function(evento) {

            // Evitamos que el navegador muestre automáticamente
            evento.preventDefault();

            // Guardamos el evento para utilizarlo cuando
            // el usuario presione el botón
            eventoInstalacion = evento;

            // Mostramos el botón
            botonInstalar.style.display = "block";
        });


        // Cuando el usuario presiona "Instalar"
        botonInstalar.addEventListener("click", async function() {

            if (!eventoInstalacion) {
                return;
            }

            // Mostramos el cuadro de instalación
            eventoInstalacion.prompt();

            // Esperamos la respuesta del usuario
            const resultado = await eventoInstalacion.userChoice;

            console.log("Resultado de instalación:", resultado.outcome);

            // Ya no necesitamos el evento
            eventoInstalacion = null;

            // Ocultamos el botón
            botonInstalar.style.display = "none";
        });


        // Detectamos cuando la aplicación fue instalada
        window.addEventListener("appinstalled", function() {

            console.log("La PWA fue instalada");

            botonInstalar.style.display = "none";
        });

    </script>

</body>
</html>
```
